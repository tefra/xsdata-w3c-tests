[tools]
python = "3.13"
uv = "latest"

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.install]
description = "Install dependencies"
alias = "i"
run = "uv pip install -r requirements.txt"

[tasks.build]
description = "Build all test models"
alias = "b"
run = "pytest -n auto --mode build"

[tasks.test]
description = "Run all tests"
alias = "t"
run = "pytest -n auto --mode xsd tests --save-output --runxfail"
